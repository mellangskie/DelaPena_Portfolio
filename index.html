    <style>
       /* Base page configuration para sa natural continuous scrolling */
html, body {
    min-height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
}
body {
    font-family: Arial, sans-serif;
    background-color: #f7f5f0; /* Light Cream Background */
    color: #4a3e3d;
    margin: 0;
    padding: 15px;
}
.container {
    max-width: 800px;
    margin: 10px auto 30px auto;
    background: #ffffff;
    padding: 25px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
header {
    text-align: center;
    margin-bottom: 25px;
}
header h1 {
    color: #8b7355; /* Light Brown */
    margin: 0 0 5px 0;
    font-size: 26px;
}
header p {
    color: #c3b091; /* Khaki */
    margin: 0;
    font-weight: bold;
    font-size: 15px;
}
.about {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 15px;
    margin-bottom: 30px;
    border-bottom: 1px solid #e0dcd3;
    padding-bottom: 20px;
}
.about img {
    width: 150px;       
    height: 150px;     
    border-radius: 50%;
    object-fit: cover;
    border: 4px solid #c3b091;
    box-shadow: 0 4px 8px rgba(0,0,0,0.05);
}
.about h3 {
    color: #8b7355;
    margin: 0 0 5px 0;
}
.school {
    font-weight: bold;
    color: #c3b091;
    font-size: 14px;
    margin-bottom: 8px;
}

/* Layout para sa bawat section */
.section-group {
    margin-bottom: 35px;
}
.section-group h3 {
    color: #8b7355;
    font-size: 20px;
    margin: 0 0 15px 0;
    border-bottom: 1px solid #e0dcd3;
    padding-bottom: 6px;
}


.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
}
.card {
    background: #fdfcf7;
    border: 1px solid #e0dcd3;
    border-radius: 8px;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid #e0dcd3;
    cursor: pointer;
}
.card-title {
    font-weight: bold;
    color: #4a3e3d;
    font-size: 15px;
}
.btn-group {
    display: flex;
    gap: 8px;
    margin-top: auto;
}
button {
    flex: 1;
    padding: 8px 12px;
    cursor: pointer;
    border: 1px solid #8b7355;
    background: #ffffff;
    color: #8b7355;
    border-radius: 4px;
    font-weight: bold;
    font-size: 13px;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
}
button:hover, button.download {
    background: #8b7355;
    color: #ffffff;
}
button.download:hover {
    background: #6e5a42;
    border-color: #6e5a42;
}


#modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    justify-content: center;
    align-items: center;
    z-index: 2000;
    padding: 10px;
    box-sizing: border-box;
}
#modal img {
    max-width: 100%;
    max-height: 80vh;
    border-radius: 4px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    object-fit: contain;
}
.close {
    position: absolute;
    top: 15px;
    right: 20px;
    color: #ffffff;
    font-size: 36px;
    font-weight: bold;
    cursor: pointer;
}

@media (min-width: 600px) {
    body { padding: 30px; }
    .about { flex-direction: row; text-align: left; padding-bottom: 20px; }
}

    </style>
</head>
<body>

<script>
   <script>

    function viewImage(url) {
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modalImg');
        const extension = url.split('.').pop().toLowerCase();

     
        if (['jpg', 'jpeg', 'png', 'gif', 'jfif', 'webp'].includes(extension)) {
            modalImg.src = url;
            modalImg.style.display = 'block';
            
          
            const oldIframe = modal.querySelector('iframe');
            if (oldIframe) oldIframe.remove();
            
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        } else {
          
            window.open(url, '_blank');
        }
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('modalImg').src = '';
        document.body.style.overflow = 'auto'; 
    }

  
    function downloadFile(url, filename) {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.responseType = "blob";
        xhr.onload = function() {
            if (xhr.status === 200) {
                var blob = xhr.response;
                var reader = new FileReader();
                reader.onloadend = function() {
                    var link = document.createElement('a');
                    link.href = reader.result;
                    link.download = filename;
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
                reader.readAsDataURL(blob);
            } else {
               
                triggerFallback(url, filename);
            }
        };
        xhr.onerror = function() {
       
            triggerFallback(url, filename);
        };
        xhr.send();
    }

    function triggerFallback(url, filename) {
        var fallbackLink = document.createElement('a');
        fallbackLink.href = url;
        fallbackLink.download = filename;
        fallbackLink.target = '_blank';
        document.body.appendChild(fallbackLink);
        fallbackLink.click();
        document.body.removeChild(fallbackLink);
    }
</script>

</script>
