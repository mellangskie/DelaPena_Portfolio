<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma. Carmela L. Dela Peña | Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            margin: 0;
            font-size: 24px;
        }
        header p {
            color: #666;
            margin: 5px 0 0;
        }
        .about {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 20px;
        }
        .about img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 8px 16px;
            border: none;
            background: #e0e0e0;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        .tab-btn.active {
            background: #333;
            color: #fff;
        }
        .panel {
            display: none;
        }
        .panel.active {
            display: block;
        }
        .card {
            background: #fafafa;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        button {
            padding: 6px 12px;
            cursor: pointer;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 4px;
        }
        button:hover {
            background: #eee;
        }
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        #modal img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 4px;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Ma. Carmela L. Dela Peña</h1>
        <p>Computer Science Portfolio</p>
    </header>

    <div class="about">
        <img src="mella.jpg" alt="Profile">
        <div>
            <h3>About Me</h3>
            <p>A dedicated Computer Science student working hard to reach my goals.</p>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'quizzes')">Quizzes</button>
        <button class="tab-btn" onclick="switchTab(event, 'exams')">Examinations</button>
        <button class="tab-btn" onclick="switchTab(event, 'labs')">Laboratory Activities</button>
        <button class="tab-btn" onclick="switchTab(event, 'projects')">Projects</button>
    </div>

    <div id="quizzes" class="panel active">
        <h3>Quizzes</h3>
        <div class="card">
            <span>Quiz 1</span>
            <div class="btn-group">
                <button onclick="viewImage('quiz1.jpeg')">View</button>
                <button onclick="downloadFile('quiz1.jpeg', 'Quiz_1.jpeg')">Download</button>
            </div>
        </div>
    </div>

    <div id="exams" class="panel">
        <h3>Examinations</h3>
        <div class="card">
            <span>Midterm Exam</span>
            <div class="btn-group">
                <button onclick="viewImage('exam1.jpg')">View</button>
                <button onclick="downloadFile('exam1.jpg', 'Midterm_Exam.jpg')">Download</button>
            </div>
        </div>
    </div>

    <div id="labs" class="panel">
        <h3>Laboratory Activities</h3>
        <div class="card">
            <span>Laboratory Activity 1</span>
            <div class="btn-group">
                <button onclick="viewImage('lab1.jpg')">View</button>
                <button onclick="downloadFile('lab1.jpg', 'Lab_1.jpg')">Download</button>
            </div>
        </div>
    </div>

    <div id="projects" class="panel">
        <h3>Projects</h3>
        <div class="card">
            <span>Final Project Prototype</span>
            <div class="btn-group">
                <button onclick="viewImage('project1.jpg')">View</button>
                <button onclick="downloadFile('project1.jpg', 'Project.jpg')">Download</button>
            </div>
        </div>
    </div>
</div>

<div id="modal" onclick="closeModal()">
    <span class="close">&times;</span>
    <img id="modalImg" src="">
</div>

<script>
    function switchTab(evt, tabId) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    function viewImage(url) {
        document.getElementById('modalImg').src = url;
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('modalImg').src = '';
    }

    function downloadFile(url, filename) {
        fetch(url)
            .then(res => res.blob())
            .then(blob => {
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                link.click();
            })
            .catch(() => window.open(url, '_blank'));
    }
</script>

</body>
</html>
